name: Patchy Tests

on:
  workflow_dispatch:
    inputs:
      test_commands:
        description: "Validated pytest commands"
        required: false
        type: string
      python_snippet:
        description: "Ad hoc Python snippet to run against this repo's real dependencies (Tier 1 executor — not a pytest command)"
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out requested branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install "fastapi<0.118" "starlette<0.48" httpx

      - name: Validate and run Patchy tests
        if: ${{ inputs.test_commands != '' }}
        env:
          TEST_COMMANDS: ${{ inputs.test_commands }}
        run: |
          while IFS= read -r command; do
            [ -z "$command" ] && continue

            if [[ ! "$command" =~ ^(python\ -m\ )?pytest\ [a-zA-Z0-9_./-]+(::[a-zA-Z_][a-zA-Z0-9_]*)*$ ]]; then
              echo "Rejected test command: $command"
              exit 1
            fi

            if [[ "$command" == *".."* || "$command" == *";"* || "$command" == *"|"* || "$command" == *">"* || "$command" == *"<"* ]]; then
              echo "Rejected unsafe test command: $command"
              exit 1
            fi

            eval "$command"
          done <<< "$TEST_COMMANDS"

      # Tier 1 real-execution path (see docs/coding-agent-roadmap.md): runs a real, ad hoc
      # Python snippet against this repo's actually-installed dependencies, in this same
      # ephemeral, secret-free runner — never on the production host, never with production
      # credentials. Written to a file via printf rather than eval'd as a shell command, so the
      # snippet's own content is never interpreted as shell syntax (no injection surface); the
      # sandboxing boundary here is "this whole job is a throwaway VM with nothing sensitive in
      # it," the same boundary the pytest path above already relies on.
      - name: Run ad hoc Python snippet
        if: ${{ inputs.python_snippet != '' }}
        env:
          PYTHON_SNIPPET: ${{ inputs.python_snippet }}
        run: |
          printf '%s\n' "$PYTHON_SNIPPET" > /tmp/patchy_snippet.py
          timeout 60 python /tmp/patchy_snippet.py